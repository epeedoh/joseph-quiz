name: joseph-quiz-ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/joseph-quiz-web/package-lock.json

      - name: Restore backend
        run: dotnet restore JosephQuiz.sln

      - name: Build backend
        run: dotnet build JosephQuiz.sln --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: web/joseph-quiz-web
        run: npm ci

      - name: Build frontend
        working-directory: web/joseph-quiz-web
        run: npm run build
